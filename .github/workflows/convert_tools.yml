name: Convert to UTF-16LE ( Authoring Tools )

on:
  push:
    paths:
      - "tf2c_toolslauncher/**"
    branches: [ "main" ]
  pull_request:
    paths:
      - "tf2c_toolslauncher/**"
  workflow_dispatch:

jobs:
  convert:
    name: Convert to UTF-16LE ( Authoring Tools )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Convert UTF-8 to UTF-16LE
        run: ./_util/convert_locales.sh tf2c_toolslauncher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf2c_toolslauncher_utf16le
          path: converted_tf2c_toolslauncher/
